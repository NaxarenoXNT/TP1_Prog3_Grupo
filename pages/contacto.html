<!DOCTYPE html>
<html lang="es">
<head>
    <title>Contacto de PlaySteam</title>
    <link rel="stylesheet" href="../CSS/contacto_style.css">
    <link rel="shortcut icon" href="../Assets/Favicon/logo_steam_pagina.PNG">
</head>

<body>
    <!-- Creación de la sección "Header" -->
    <header>
        <img class="contacto_logo_header" src="../Assets/Favicon/logo_steam_pagina.PNG">
        <h4 class="contacto_h4">PlaySteam</h4>
        <nav>
            <a class="contacto_nav_header" href="../Index.html">Inicio</a>
            <a class="contacto_nav_header" href="../pages/servicios.html">Servicios</a>
            <a class="contacto_nav_header" href="../pages/equipo.html">Equipo</a>
            <a class="contacto_nav_header" href="../pages/pedido.html">Pedido</a>
            <a class="contacto_nav_header activo" href="../pages/contacto.html">Contacto</a>
            <a class="contacto_nav_header" href="../pages/faq.html">FAQ</a>
        </nav>
    </header>


    <!-- Creación de la sección "Formulario" -->
    <form class="contacto_formulario">
        <p class="contacto_dudas">¿Tenés dudas o necesitás ayuda?</p>
        <p class="contacto_respondemos">Escribinos y te responderemos a la brevedad.</p>
        <div class="nombre">
            <label for="nombre">Nombre/s</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
        </div>

        <div class="apellido">
            <label for="apellido">Apellido/s</label>
            <input type="text" id="apellido" name="apellido" placeholder="García" required>
        </div>

        <div class="email">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="@gmail.com" required>
        </div>

        <div class="mensaje">
            <label for="mensaje">Deja tu mensaje</label>
            <textarea name="mensaje" id="mensaje" rows="5" required></textarea>
        </div>

        <div>
            <button class="contacto_button">Enviar</button>
        </div>
    </form>


    <!-- Creación de la sección "Footer" -->
    <footer class="contacto_footer">
        <div class="contacto_footer_contenido">
            
            <img class="contacto_logo_footer" src="../Assets/Favicon/logo_steam_pagina.PNG">

            <h3 class="contacto_footer_logo">PlaySteam</h3>

            

            <nav>
                <a class="contacto_nav_footer" href="../Index.html">Inicio</a>
                <a class="contacto_nav_footer" href="../pages/servicios.html">Servicios</a>
                <a class="contacto_nav_footer" href="../pages/equipo.html">Equipo</a>
                <a class="contacto_nav_footer" href="../pages/pedido.html">Pedido</a>
                <a class="contacto_nav_footer" href="../pages/contacto.html">Contacto</a>
                <a class="contacto_nav_footer" href="../pages/faq.html">FAQ</a>
            </nav>

            
            <p class="contacto_footer_copy">© 2026 PlaySteam. Todos los derechos reservados.</p>
            
            

        </div>
    </footer>
</body>
</html>
