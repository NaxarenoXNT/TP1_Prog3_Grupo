<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contacto de PlaySteam</title>
    <link rel="stylesheet" href="../CSS/contacto_style.css">
</head>

<body>
    <!-- Creación de la sección "Header" -->
    <header>
        <h4 class="contacto_h4">PlaySteam</h4>
        <nav>
            <a href="../Index.html">Inicio</a>
            <a href="../pages/servicios.html">Servicios</a>
            <a href="../pages/equipo.html">Equipo</a>
            <a href="../pages/pedido.html">Pedido</a>
            <a class="activo" href="../pages/contacto.html">Contacto</a>
            <a href="../pages/faq.html">FAQ</a>
        </nav>
    </header>


    <!-- Creación de la sección "Formulario" -->
    <form class="contacto_formulario">
        <p class="contacto_dudas">¿Tenés dudas o necesitás ayuda?</p>
        <p class="contacto_respondemos">Escribinos y te responderemos a la brevedad.</p>
        <div class="nombre">
            <label for="nombre">Nombre/s</label>
            <input type="text" id="nombre" name="nombre" placeholder="Juan" required>
        </div>

        <div class="apellido">
            <label for="apellido">Apellido/s</label>
            <input type="text" id="apellido" name="apellido" placeholder="García" required>
        </div>

        <div class="email">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="@gmail.com" required>
        </div>

        <div class="mensaje">
            <label for="mensaje">Deja tu mensaje</label>
            <textarea name="mensaje" id="mensaje" rows="5" required></textarea>
        </div>

        <div>
            <button class="contacto_button">Enviar</button>
        </div>
    </form>
</body>
</html>
